  pre-commit:
    name: Pre-commit Hook Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 🧾 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: ${{ runner.os }}-pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pre-commit-

      - name: 📥 Install pre-commit
        run: |
          python -m pip install --upgrade "pip>=26.1"
          pip install pre-commit

      - name: 🔍 Run pre-commit on all files
        run: pre-commit run --all-files --show-diff-on-failure

  gui-no-raw-api:
    name: GUI Raw API Fetch Guard
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 🧾 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 🔍 Check for unapproved raw /api/ fetches in gui/src/
        run: python scripts/check_no_renderer_api_fetch.py

  wheel-contents-smoke:
    name: Wheel Contents Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 🧾 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install build tool
        run: |
          python -m pip install --upgrade "pip>=26.1"
          pip install build

      - name: 🏗️ Build wheel and check required contents
        run: python scripts/check_wheel_contents.py

  secret-scan:
    name: Hardcoded Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 🧾 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📥 Install detect-secrets
        run: pip install detect-secrets

      - name: 🔍 Scan for hardcoded secrets
        run: |
          python -m detect_secrets scan \
            --exclude-files "\.venv|__pycache__|\.git|\.egg-info" \
            --baseline .secrets.baseline
          echo "Secret scan passed — no new secrets detected."
