      - name: 🔒 Run dependency vulnerability scan
        # Accepted-risk CVEs are documented in docs/security/VULNERABILITY-SCAN.md
        # in three labeled sections with per-entry owner, expiry, and risk tier:
        #   - Runtime Dependencies
