name: CI

on:
  push:
    branches: [master, claude/**]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 🧾 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-lint-

      - name: 📥 Install linting tools
        run: |
          python -m pip install --upgrade "pip>=26.1"
          pip install "ruff==0.15.8" "black==26.3.1"

      - name: 🔍 Run Ruff linting
        run: ruff check --output-format=github .

      - name: 🎨 Check code formatting with Black
        run: black --check --diff rex/ tests/ bridge/ scripts/ *.py

      - name: 🧾 Compile check (syntax)
        run: |
          python -m compileall -q rex scripts

      - name: 🗑️ Check no generated artifacts are committed
        run: python scripts/check_no_generated_artifacts.py

      - name: Check deprecated Python APIs
        run: python scripts/check_deprecated_apis.py

      - name: Validate skipped-test inventory
        run: python scripts/check_skip_inventory.py

  security-audit:
    name: Security Audit Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 🧾 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 🛡️ Run security audit release gate
        run: python scripts/security_audit.py --release-gate

  typecheck:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 🧾 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-typecheck-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-typecheck-

      - name: 📥 Install mypy and stubs
        run: |
          python -m pip install --upgrade "pip>=26.1"
          pip install mypy types-requests
          pip install -e .

      - name: 🔎 Run mypy
        run: |
          mypy rex --ignore-missing-imports

  macos-keychain-vault:
    name: macOS Keychain Vault
    runs-on: macos-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install AskRex and test runner
        run: |
          python -m pip install --upgrade "pip>=26.1"
          pip install -e . pytest

      - name: Run credential-vault unit tests
        run: pytest -q tests/test_credential_vault.py

      - name: Verify real macOS Keychain roundtrip
        run: |
          python - <<'PY'
          import tempfile
          from pathlib import Path
          from rex.credential_vault import generate_credential_ref, get_credential_vault

          ref = generate_credential_ref()
          with tempfile.TemporaryDirectory() as tmp:
              vault = get_credential_vault(vault_path_override=Path(tmp) / "index.json")
              try:
                  vault.set_secret(ref, "askrex-ci-keychain-roundtrip", integration="ci", account=None, slot="token")
                  assert vault.get_secret(ref, integration="ci", account=None, slot="token") == "askrex-ci-keychain-roundtrip"
                  assert any(entry.key == ref for entry in vault.list_entries())
              finally:
                  try:
                      vault.delete_secret(ref, integration="ci", account=None, slot="token")
                  except Exception:
                      pass
          print("macOS Keychain roundtrip passed")
          PY

  gui-lint:
    name: GUI ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 🧾 Checkout repository
        uses: actions/checkout@v4

      - name: 🟩 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: gui/package-lock.json

      - name: 📥 Install GUI dependencies
        run: cd gui && npm ci

      - name: 🧹 Run ESLint
        run: cd gui && npm run lint

  gui-typecheck:
    name: GUI TypeScript Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 🧾 Checkout repository
        uses: actions/checkout@v4

      - name: 🟩 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: gui/package-lock.json

      - name: 📥 Install GUI dependencies
        run: cd gui && npm ci

      - name: 🔎 Run TypeScript typecheck
        run: cd gui && npm run typecheck

  gui-test:
    name: GUI Vitest Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 🧾 Checkout repository
        uses: actions/checkout@v4

      - name: 🟩 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: gui/package-lock.json

      - name: 📥 Install GUI dependencies
        run: cd gui && npm ci

      - name: 🧪 Run Vitest tests
        run: cd gui && npm test

      - name: 🔒 Verify tests did not modify tracked files
        if: always()
        run: |
          dirty=$(git status --porcelain | grep -v '^\?\?' || true)
          if [ -n "$dirty" ]; then
            echo "::error::GUI tests modified tracked repo files:"
            echo "$dirty"
            exit 1
          fi
          echo "Working tree is clean — no tracked files were modified by GUI tests."

  gui-build:
    name: GUI Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 🧾 Checkout repository
        uses: actions/checkout@v4

      - name: 🟩 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: gui/package-lock.json

      - name: 📥 Install GUI dependencies
        run: cd gui && npm ci

      - name: 🏗️ Build GUI
        run: cd gui && npm run build

  node-audit:
    name: Node Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 🧾 Checkout repository
        uses: actions/checkout@v4

      - name: 🟩 Set up Node.js (gui/)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: gui/package-lock.json

      - name: 🔒 Audit gui/ dependencies
        run: cd gui && npm audit --audit-level=high

      - name: 🟩 Set up Node.js (rex/ui/)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: rex/ui/package-lock.json

      - name: 🔒 Audit rex/ui/ dependencies
        run: cd rex/ui && npm audit --audit-level=high

  tests:
    name: Python 3.11 Tests & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: 🧾 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 🧹 Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost
          sudo apt-get clean
          pip cache purge || true

      - name: 📦 Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml', '**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: 🧰 Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            libsndfile1 \
            libasound2-dev \
            portaudio19-dev

      - name: 📥 Install Python dependencies (CPU-only)
        run: |
          python -m pip install --upgrade "pip>=26.1" "setuptools>=78.1.1" wheel
          pip install -e ".[dev]"
          pip install pip-audit

      - name: ✅ Verify CLI entrypoints
        run: |
          python -m rex --help
          rex-config --help
          python -c "from rex.cli import main; print('rex ok')"
          python -c "from rex.config import cli; print('rex-config ok')"
          python -c "import rex_speak_api; print('rex-speak-api ok')"
          python -c "from rex.computers.agent_server import main; print('rex-agent ok')"
          python -c "from rex.gui_app import main; print('rex-gui ok')"
          python -c "from rex.openclaw.tool_server import main; print('rex-tool-server ok')"

      - name: 🧪 Run tests with coverage
        shell: bash
        run: |
          pytest -m "not slow and not audio and not gpu" -rs --cov=rex --cov-fail-under=75 --cov-report=term-missing --cov-report=html --cov-report=xml 2>&1 | tee coverage.txt
        env:
          REX_FILE_LOGGING_ENABLED: "false"

      - name: Enforce skipped-test budget
        run: python scripts/check_skip_budget.py coverage.txt

      - name: 🔗 Run integration tests
        shell: bash
        run: |
          pytest -m integration -q
        env:
          REX_FILE_LOGGING_ENABLED: "false"

      - name: 🔒 Verify tests did not modify tracked files
        if: always()
        run: |
          dirty=$(git status --porcelain -- ':!.coverage' ':!coverage.xml' ':!htmlcov/' | grep -v '^\?\?' || true)
          if [ -n "$dirty" ]; then
            echo "::error::Tests modified tracked repo files:"
            echo "$dirty"
            exit 1
          fi
          echo "Working tree is clean — no tracked files were modified by tests."

      - name: 📤 Upload coverage report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            .coverage
            coverage.xml
            htmlcov/

  security-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 🧾 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
