name: Windows Electron Artifact

on:
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/windows-electron-artifact.yml"
      - "bridge/**"
      - "gui/**"
      - "rex/**"
      - "scripts/build_managed_python_runtime.ps1"
      - "scripts/test_installed_electron_artifact.ps1"
      - "scripts/background_lifecycle_harness.py"
      - "scripts/background_lifecycle_fake_child.py"
      - "scripts/verify_electron_package_contents.py"
      - "requirements-electron-*.txt"
  push:
    tags: ["v*"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  installed-artifact:
    name: Installed Windows Electron artifact
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Validate PowerShell artifact scripts
        shell: powershell
        run: |
          $parseErrors = @()
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/test_installed_electron_artifact.ps1'),
            [ref]$null,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.1"
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: pip

      - name: Install exact build tools
        run: python -m pip install "build==1.3.0"

      - name: Install exact GUI dependencies
        working-directory: gui
        run: npm ci

      - name: Build wheel
        run: python -m build --wheel

      # Authenticode signing activates only when the certificate secret is
      # provisioned. Without WINDOWS_CSC_LINK the build produces the same
      # unsigned artifact as before; nothing is claimed to be signed.
      - name: Configure Authenticode signing when certificate secret exists
        shell: powershell
        env:
          WINDOWS_CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          WINDOWS_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CSC_LINK)) {
            Write-Host "No signing certificate secret configured - building an unsigned artifact."
          } else {
            Add-Content -Path $env:GITHUB_ENV -Value "CSC_LINK=$env:WINDOWS_CSC_LINK"
            Add-Content -Path $env:GITHUB_ENV -Value "CSC_KEY_PASSWORD=$env:WINDOWS_CSC_KEY_PASSWORD"
            Write-Host "Signing certificate secret detected - electron-builder will sign the artifact."
          }

      - name: Build managed runtime and installer
        working-directory: gui
        run: npm run dist

      - name: Verify Authenticode signature truthfully
        shell: powershell
        run: |
          $sig = Get-AuthenticodeSignature "gui/dist/AskRex Setup 1.0.0.exe"
          Write-Host "Installer Authenticode status: $($sig.Status)"
          if ([string]::IsNullOrWhiteSpace($env:CSC_LINK)) {
            Write-Host "No signing secret was configured; the artifact is expected to be unsigned (status: $($sig.Status))."
          } elseif ($sig.Status -ne 'Valid') {
            Write-Error "Signing was configured but the installer signature status is $($sig.Status)."
            exit 1
          } else {
            Write-Host "Installer signature verified. Signer: $($sig.SignerCertificate.Subject)"
          }

      - name: Reject missing or private packaged resources
        run: python scripts/verify_electron_package_contents.py gui/dist/win-unpacked/resources

      - name: Exercise installed artifact without machine Python or Node
        shell: powershell
        run: |
          scripts/test_installed_electron_artifact.ps1 `
            -Installer "gui/dist/AskRex Setup 1.0.0.exe" `
            -BuildPython python `
            -DiagnosticsPath "$env:RUNNER_TEMP\askrex-artifact-smoke.json"

      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: askrex-windows-smoke-diagnostics
          path: ${{ runner.temp }}\askrex-artifact-smoke.json
          if-no-files-found: warn

      - name: Upload installer evidence
        uses: actions/upload-artifact@v4
        with:
          name: askrex-windows-installer
          path: |
            gui/dist/AskRex Setup 1.0.0.exe
            gui/dist/latest.yml
          if-no-files-found: error
